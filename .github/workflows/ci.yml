---
name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '18 6 * * *'

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Run cspell
        uses: streetsidesoftware/cspell-action@v9
        with:
          incremental_files_only: false
          use_cspell_files: true

  ci:
    uses: ansible-middleware/github-actions/.github/workflows/ci.yml@main
    secrets: inherit
    with:
      fqcn: 'middleware_automation/common'
      molecule_tests: >-
        [ "prod_eap", "stage_eap", "prod_rhbk", "unified_api_validation" ]
